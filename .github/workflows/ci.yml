name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: extreme-bass-booster.exe
            asset: extreme-bass-booster-windows-x64.exe
          - os: ubuntu-latest
            artifact: extreme-bass-booster
            asset: extreme-bass-booster-linux-x64
          - os: macos-latest
            artifact: extreme-bass-booster
            asset: extreme-bass-booster-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev
      - run: cargo test
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp target/release/${{ matrix.artifact }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
